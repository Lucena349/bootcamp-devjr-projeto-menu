<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="container" > <!--Container principal-->


        <h2>Meunu - Faça a sua escolha</h2>
        <div class="prato_principal card"> <!--Card do Prato Principal-->
            <h3>Prato Principal</h3>
            <h4>Todos os pratos acompanham arroz, feijão e a sobremesa do dia.</h4>

            <div class="card-body">
                <p>Bife com batata</p>
            </div>

            <div class="card-body">
                <p>Coxa de Frango Crocante</p>
            </div>

            <div class="card-body">
                <p>Carne de Panela</p>
            </div>

        </div>


        <div class="card"> <!--Card dos Acompanhamentos-->
            <h3>Acompanhamentos</h3>
            <h4>Porções para uma pessoa</h4>

            <div class="card-body">
                <p>Farofa</p>
            </div>

            <div class="card-body">
                <p>Salada</p>
            </div>

            <div class="card-body">
                <p>Torresmo</p>
            </div>



        </div>

        <div class="card"> <!--Card dos dados pessoais-->
            <h3>Dados Pessoais</h3>

            <form>
                <input type="text" name="" id="nome" placeholder="Digite seu nome">
                <input type="phone" name="" id="telefone" placeholder="Digite o seu telefone">
                <input type="email" name="" id="email" placeholder="Digite o seu email"> 
            </form>

        </div>

    <button class="botao_calc">Calcular</button>
    </div>
</body>
</html>
